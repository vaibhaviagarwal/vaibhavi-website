<script>
(() => {
    const binaryCanvas = document.getElementById('binary-canvas');
    const graphCanvas = document.getElementById('graph-canvas');
    const overlay = document.querySelector('.math-overlay');

    let dpr = window.devicePixelRatio || 1;
    function resize() {
        dpr = window.devicePixelRatio || 1;
        const cssW = document.documentElement.clientWidth || window.innerWidth;
        const cssH = document.documentElement.clientHeight || window.innerHeight;
        binaryCanvas.width = Math.floor(cssW * dpr);
        binaryCanvas.height = Math.floor(cssH * dpr);
        graphCanvas.width = Math.floor(cssW * dpr);
        graphCanvas.height = Math.floor(cssH * dpr);
        binaryCanvas.style.width = cssW + 'px';
        binaryCanvas.style.height = cssH + 'px';
        graphCanvas.style.width = cssW + 'px';
        graphCanvas.style.height = cssH + 'px';
        bCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        gCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initColumns();
    }

    window.addEventListener('resize', resize);

    const bCtx = binaryCanvas.getContext('2d');
    const chars = ['0','1'];
    const blue = '102,204,255';
    const blue2 = '60,160,255';
    let columns = [];
    let fontSize = 14;

    function initColumns() {
        fontSize = Math.max(10, Math.floor(window.innerWidth / 220));
        const cssW = binaryCanvas.width / dpr;
        const cssH = binaryCanvas.height / dpr;
        const cols = Math.ceil(cssW / fontSize) + 2;
        columns = new Array(cols).fill(0).map(() => ({y: Math.random() * cssH}));
        bCtx.font = fontSize + 'px monospace';
    }

    function drawBinary() {
        const cssW = binaryCanvas.width / dpr;
        const cssH = binaryCanvas.height / dpr;
        bCtx.clearRect(0,0,cssW,cssH);
        bCtx.fillStyle = 'rgba(2,6,23,0.12)';
        bCtx.fillRect(0,0,cssW,cssH);

        for (let i = 0; i < columns.length; i++) {
            const x = i * fontSize;
            const col = columns[i];
            const text = chars[Math.floor(Math.random() * chars.length)];
            bCtx.shadowColor = Math.random() > 0.6 ? `rgba(${blue},0.7)` : `rgba(${blue2},0.7)`;
            bCtx.shadowBlur = 2 + Math.random()*3;
            bCtx.fillStyle = Math.random() > 0.6 ? `rgba(${blue},0.68)` : `rgba(${blue2},0.68)`;
            bCtx.fillText(text, x, col.y);

            col.y += fontSize * 0.45 + Math.random() * 1;
            const cssH2 = binaryCanvas.height / dpr;
            if (col.y > cssH2 + Math.random() * 300) {
                col.y = -10 - Math.random() * 60;
            }
        }
    }

    const gCtx = graphCanvas.getContext('2d');
    let t = 0;

    function drawGraphs() {
        const cssW = graphCanvas.width / dpr;
        const cssH = graphCanvas.height / dpr;
        gCtx.clearRect(0,0,cssW,cssH);

        gCtx.strokeStyle = `rgba(${blue},0.03)`;
        gCtx.lineWidth = 1;
        const gridSize = 40;
        gCtx.beginPath();
        for (let x = 0; x < cssW; x += gridSize) {
            gCtx.moveTo(x + 0.5, 0);
            gCtx.lineTo(x + 0.5, cssH);
        }
        for (let y = 0; y < cssH; y += gridSize) {
            gCtx.moveTo(0, y + 0.5);
            gCtx.lineTo(cssW, y + 0.5);
        }
        gCtx.stroke();

        gCtx.beginPath();
        const amplitude = Math.min(80, cssH * 0.08);
        const centerY = cssH * 0.45;
        for (let px = 0; px <= cssW; px += 8) {
            const phase = (px * 0.008) + t * 0.06;
            const y = centerY + Math.sin(phase) * amplitude * (0.6 + 0.4 * Math.cos(px * 0.002));
            if (px === 0) gCtx.moveTo(px, y);
            else gCtx.lineTo(px, y);
        }
        gCtx.strokeStyle = `rgba(${blue},0.16)`;
        gCtx.lineWidth = 2;
        gCtx.shadowColor = `rgba(${blue},0.06)`;
        gCtx.shadowBlur = 6;
        gCtx.stroke();
    }

    function populateOverlay() {
        overlay.textContent = '';
    }

    function loop() {
        t += 0.006;
        drawBinary();
        drawGraphs();
        requestAnimationFrame(loop);
    }

    function setupScrollAnimations() {
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.scroll-fade, .scroll-slide').forEach(el => {
            observer.observe(el);
        });
    }

    function setupPageTransitions() {
        document.body.classList.add('is-loaded');

        document.addEventListener('click', (event) => {
            const link = event.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('mailto:') || link.target === '_blank') {
                return;
            }

            if (link.origin === window.location.origin || link.classList.contains('external-transition')) {
                event.preventDefault();
                document.body.classList.add('is-exiting');
                setTimeout(() => {
                    window.location.href = link.href;
                }, 220);
            }
        });
    }

    resize();
    populateOverlay();
    setupScrollAnimations();
    setupPageTransitions();
})();
</script>
